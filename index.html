 }
 if(floors)for(let r=1;r<floors;r++)line(qpoint(a,b,c,d,r/floors,0),qpoint(a,b,c,d,r/floors,1),'rgba(24,30,30,.4)',.8);
}
function photoCrown(x,y,rx,ry,seed,shade){

 g.save();g.translate(x,y);g.fillStyle='rgba(28,46,29,.20)';g.beginPath();g.ellipse(2.7,3.6,rx,ry,0,0,Math.PI*2);g.fill();

function drawRoads(){g.clearRect(0,0,500,500);g.fillStyle=PHOTO.concrete;g.fillRect(0,0,500,500);const cut=roads.map(()=>-1);for(let i=0;i<roadStep;i++)cut[roadSteps[i].r]=roadSteps[i].end;g.lineCap='round';g.lineJoin='round';for(const [w,c]of [[25,'#99968e'],[22,'#d0c7b9'],[17,'#aba79f'],[14,'#64696b']]){g.strokeStyle=w===14?PHOTO.asphalt:c;g.lineWidth=w;roads.forEach((road,i)=>{if(cut[i]<1)return;g.beginPath();g.moveTo(road[0].x,road[0].y);for(let j=1;j<=cut[i];j++)g.lineTo(road[j].x,road[j].y);g.stroke()})}g.lineCap='butt';}
// Nieuw in versie 12.6: functies uitsluitend op de onbebouwde, grijze tussenruimtes.
function distanceSegment(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy,t=l?clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/l,0,1):0;return Math.hypot(p.x-a.x-dx*t,p.y-a.y-dy*t)}
function plotPoints(plot){const {x,y,w,h,ang}=plot,c=Math.cos(ang),s=Math.sin(ang);return [[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]].map(([a,b])=>({x:x+a*c-b*s,y:y+a*s+b*c}))}
function makeInfill(){
 infill=[];infillIdx=0;
 const definitions=[{kind:'parking',w:48,h:30},{kind:'basket',w:43,h:25},{kind:'plein',w:38,h:38}];
 const forbidden=p=>{
  if(p.x<18||p.y<18||p.x>482||p.y>482||onRoad(p)||onGreen(p))return true;
  if(buildings.some(b=>p.x>=b.bounds.minx-5&&p.x<=b.bounds.maxx+5&&p.y>=b.bounds.miny-5&&p.y<=b.bounds.maxy+5))return true;
  if(paths.some(path=>path.some((a,i)=>i&&distanceSegment(p,path[i-1],a)<6)))return true;
  if(trees.some(t=>dst(t,p)<t.extent+4)||specialTrees.some(t=>dst(t,p)<t.r+5))return true;
  if(lamps.some(l=>dst(l.base,p)<7||dst(l.top,p)<7)||cars.some(c=>dst(c,p)<11))return true;
  if(forest.some(t=>dst(t,p)<t.r+5))return true;
  return infill.some(f=>{const dx=p.x-f.x,dy=p.y-f.y;return Math.abs(dx)<f.w/2+8&&Math.abs(dy)<f.h/2+8});
 };
 for(const def of definitions){
  let best=null,score=-Infinity;
  for(let attempt=0;attempt<1600;attempt++){
   const p={...def,x:rnd(42,458),y:rnd(42,458),ang:Math.random()<.5?0:Math.PI/2};
   // Alleen de ornamenten roteren, de maatvoering blijft identiek.
   const corners=plotPoints(p),bb=bounds(corners);
   if(bb.minx<19||bb.miny<19||bb.maxx>481||bb.maxy>481)continue;
   let fail=false;
   for(let v=-def.h/2-3;v<=def.h/2+3&&!fail;v+=3){for(let u=-def.w/2-3;u<=def.w/2+3;u+=3){
    const x=p.x+u*Math.cos(p.ang)-v*Math.sin(p.ang),y=p.y+u*Math.sin(p.ang)+v*Math.cos(p.ang);
    if(forbidden({x,y})){fail=true;break}
   }}
   if(fail)continue;
   const near=nearestRoad(p);
   const candidateScore=(near&&near.dist<100?20-Math.abs(near.dist-42)*.16:0)+rnd(0,12);
   if(candidateScore>score){score=candidateScore;best=p}
   if(score>26)break;
  }
  if(best)infill.push(best);
 }
}
function drawInfill(p){
 g.save();g.translate(p.x,p.y);g.rotate(p.ang);
 const w=p.w,h=p.h;
 const box=(x,y,ww,hh,col)=>{g.fillStyle=col;g.fillRect(x,y,ww,hh)};

  box(-w/2,-h/2,w,h,'#b9b9b4');rim('#8b8c88',1.3);
  g.strokeStyle='#f5f2e9';g.lineWidth=.85;
  const bays=6,slot=w/bays;
  for(let i=1;i<bays;i++){g.beginPath();g.moveTo(-w/2+slot*i,-h/2+2);g.lineTo(-w/2+slot*i,-h/2+h*.43);g.moveTo(-w/2+slot*i,h/2-2);g.lineTo(-w/2+slot*i,h/2-h*.43);g.stroke()}
  for(let i=0;i<6;i++){if(Math.random()>.28)continue;let cx=-w/2+(i+.5)*slot;box(cx-2,-h/2+4,4,7,['#698b9b','#b87767','#ddcf94'][i%3]);box(cx-1.5,-h/2+6,3,2,'#e0e9e8')}
 }else if(p.kind==='basket'){
  box(-w/2,-h/2,w,h,'#b77f63');rim('#eee6ce',1.1);
  g.strokeStyle='#eee6ce';g.lineWidth=.85;
  g.beginPath();g.moveTo(0,-h/2);g.lineTo(0,h/2);g.moveTo(-w/2+2,0);g.lineTo(w/2-2,0);g.stroke();
  g.beginPath();g.arc(0,0,5.3,0,Math.PI*2);g.stroke();
  for(const side of [-1,1]){
   let x=side*(w/2-5);g.strokeRect(x-3,-6,6,12);g.beginPath();g.arc(x-side*1.5,0,1.4,0,Math.PI*2);g.stroke();g.beginPath();g.arc(x,0,8,side===1?Math.PI/2:-Math.PI/2,side===1?3*Math.PI/2:Math.PI/2);g.stroke();
  }
 }else{
  box(-w/2,-h/2,w,h,'#d5cec0');rim('#a7a096',1.4);
  g.strokeStyle='#c1b9aa';g.lineWidth=.45;
  for(let i=-w/2+5;i<w/2;i+=5){g.beginPath();g.moveTo(i,-h/2);g.lineTo(i,h/2);g.stroke()}
  for(let i=-h/2+5;i<h/2;i+=5){g.beginPath();g.moveTo(-w/2,i);g.lineTo(w/2,i);g.stroke()}
  g.fillStyle='#d9e8e5';g.beginPath();g.arc(0,0,8,0,Math.PI*2);g.fill();g.strokeStyle='#f9faf6';g.lineWidth=2;g.stroke();
  g.fillStyle='#97b9b9';g.beginPath();g.arc(0,0,4.5,0,Math.PI*2);g.fill();
  g.fillStyle='#f6f9f5';g.beginPath();g.arc(0,0,1.6,0,Math.PI*2);g.fill();
  for(const side of [-1,1]){box(side*13-4,-2,8,4,'#a38d76');box(side*13-3,2,1,2,'#72675b');box(side*13+2,2,1,2,'#72675b')}
 }
 g.restore();
}
function prepare(){running=false;last=0;makeRoads();makeGrass();makeBuildings();makePaths();makeTrees();makeLamps();makeCars();makeForest();makeSpecialTrees();makeInfill();buildingIdx=0;treeIdx=0;lampIdx=0;carIdx=0;forestIdx=0;pathIdx=0;specialIdx=0;infillIdx=0;greenIdx=-1;needsNew=false;clear()}
function clear(){g.fillStyle=PHOTO.concrete;g.fillRect(0,0,500,500);update()}
function phase(){if(roadStep<roadSteps.length)return 0;if(greenIdx<greenFields.length)return 1;if(pathIdx<paths.length)return 2;if(buildingIdx<buildings.length)return 3;if(specialIdx<specialTrees.length)return 4;if(treeIdx<trees.length)return 5;if(lampIdx<lamps.length)return 6;if(carIdx<cars.length)return 7;if(forestIdx<forest.length)return 8;if(infillIdx<infill.length)return 9;return 10}
function update(){const p=phase();E('phase').textContent=['Wegen en voetpaden tekenen','Groot veld en grasveldjes inkleuren','Toegangspaadjes tekenen','Gebouwen tekenen','Drie verschillende grote bomen','Straatbomen planten','Lichtzuilen plaatsen',"Auto's tekenen",'Bosrand aanleggen','Vrije grondvlakken inrichten','Stad afgewerkt'][p];E('count').textContent=p===0?'Wegen '+Math.floor(roadStep/Math.max(1,roadSteps.length)*100)+'%':p===1?Math.max(0,greenIdx)+' / '+greenFields.length+' grasveldjes':p===4?specialIdx+' / '+specialTrees.length+' grote bomen':buildings.length+' gebouwen · '+trees.length+' straatbomen · '+specialTrees.length+' grote bomen';E('status').textContent=running?'● Tekenen':needsNew?'Nieuwe stad bij Start':p===10?'Klaar':'Gepauzeerd'}
function start(){if(running)return;if(needsNew||phase()===10)prepare();running=true;last=0;update()}
function reset(){running=false;needsNew=true;last=0;roads=[];roadSteps=[];roadStep=0;greenFields=[];greenIdx=0;largeField=null;largeMask.fill(0);greenMask.fill(0);buildings=[];buildingIdx=0;paths=[];pathIdx=0;trees=[];treeIdx=0;lamps=[];lampIdx=0;cars=[];carIdx=0;forest=[];forestIdx=0;specialTrees=[];specialIdx=0;infill=[];infillIdx=0;clear()}
function tick(t){if(!root.isConnected)return;if(running&&t-last>=Math.max(22,900-(+E('speed').value)*8.8)){last=t;if(roadStep<roadSteps.length){roadStep=Math.min(roadSteps.length,roadStep+4);drawRoads()}else if(greenIdx<0){drawLarge();greenIdx=0}else if(greenIdx<greenFields.length)drawGrass(greenFields[greenIdx++]);else if(pathIdx<paths.length)drawPath(paths[pathIdx++]);else if(buildingIdx<buildings.length)drawBuilding(buildings[buildingIdx++]);else if(specialIdx<specialTrees.length)drawSpecialTree(specialTrees[specialIdx++]);else if(treeIdx<trees.length)drawTree(trees[treeIdx++]);else if(lampIdx<lamps.length)drawLamp(lamps[lampIdx++]);else if(carIdx<cars.length)drawCar(cars[carIdx++]);else if(forestIdx<forest.length)drawForest(forest[forestIdx++]);else if(infillIdx<infill.length)drawInfill(infill[infillIdx++]);else running=false;update()}requestAnimationFrame(tick)}
E('start').onclick=start;E('pause').onclick=()=>{running=false;update()};E('reset').onclick=reset;['rings','palette','roofs'].forEach(id=>E(id).onchange=reset);reset();requestAnimationFrame(tick);
})();
